name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pick and unpack the NEWEST project zip (and refuse an old one)
        run: |
          # 1) DjApp-crossdj-v3-newui-2.zip (then -1) wins when it is in the repo; 2) otherwise the zip committed most recently
          ZIP=$(ls DjApp-crossdj-v3-newui-2.zip DjApp-crossdj-v3-newui-1.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            ZIP=$(for f in DjApp*.zip; do [ -f "$f" ] && echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          fi
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            echo "ZIP_NAME=$(basename "$ZIP" .zip)" >> "$GITHUB_ENV"
            rm -rf DjApp
