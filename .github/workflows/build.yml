name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o DjApp-fixed2.zip
      - name: Add gradle properties
        run: printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > DjApp/gradle.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        working-directory: DjApp
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Show errors
        if: failure()
        working-directory: DjApp
        run: |
          {
            echo '## ERROR DETAILS'
            echo '```'
            grep -n -B2 -A12 -E "CMake Error|CXX1212|error:|e: |What went wrong" build.log | cut -c1-400 | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DjApp-debug-apk
          path: DjApp/app/build/outputs/apk/debug/app-debug.apk
