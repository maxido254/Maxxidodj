name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DjApp.zip
      - run: |
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n" > DjApp/gradle.properties
          sed -i 's/cppFlags += "-std=c++17"/cppFlags += "-std=c++17"; arguments += "-DANDROID_STL=c++_shared"/' DjApp/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - shell: bash
        working-directory: DjApp
        run: gradle assembleDebug --console=plain 2>&1 | tee build.log
      - if: failure()
        working-directory: DjApp
        run: |
          { echo '## Errors'; echo '```'; grep -E -A25 "What went wrong|^e: |CXX1212" build.log | fold -s -w 60 | head -120; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: DjApp-debug-apk
          path: DjApp/app/build/outputs/apk/debug/app-debug.apk
      - run: gh release create v${{ github.run_number }} DjApp/app/build/outputs/apk/debug/app-debug.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
