name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/verify-source.mjs
  build:
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify checked-in source
        run: |
          test -f DjApp/settings.gradle.kts
          test -f DjApp/app/src/main/cpp/engine.cpp
          echo "ZIP_NAME=source-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Cache AI model (HT-Demucs, downloaded by Gradle at build time)
        uses: actions/cache@v4
        with:
          path: DjApp/app/src/main/assets/htdemucs_fp16.onnx
          key: htdemucs-fp16-onnx-v1
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        working-directory: DjApp
        run: gradle assembleDebug --stacktrace > build.log 2>&1 || (echo BUILD_FAILED >> build.log; exit 1)
      - name: Show errors
        if: failure()
        working-directory: DjApp
        run: |
          grep -E "^e: |error:|What went wrong|Could not|checksum|SCNet" -A3 build.log | head -30 > err.txt || true
          echo "----- last lines -----" >> err.txt
          tail -15 build.log >> err.txt
          cat err.txt
          MSG=$(head -c 3500 err.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::$MSG"
          sed 's/^/    /' err.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Report what takes space inside the APK
        run: |
          APK=DjApp/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "===== 25 BIGGEST FILES ====="
          unzip -lv "$APK" | awk 'NR>3 && NF>=8 {print $1, $3, $8}' | sort -rn | head -25 | awk '{printf "%7.1f MB raw, %7.1f MB in APK  %s\n", $1/1048576, $2/1048576, $3}'
          echo "===== PER FOLDER (MB) ====="
          unzip -lv "$APK" | awk 'NR>3 && NF>=8 {split($8,a,"/"); d[a[1]"/"a[2]]+=$1} END {for (k in d) printf "%7.1f  %s\n", d[k]/1048576, k}' | sort -rn | head -12
      - name: Name the APK after its source commit
        run: |
          APK_NAME="MAXIDO-DJ_${ZIP_NAME}_run${GITHUB_RUN_NUMBER}"
          cp DjApp/app/build/outputs/apk/debug/app-debug.apk "DjApp/${APK_NAME}.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          {
            echo "## Built from: \`${GITHUB_SHA}\`"
            echo "APK file: \`${APK_NAME}.apk\` (run #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7})"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: DjApp/${{ env.APK_NAME }}.apk
