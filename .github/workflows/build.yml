name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o DjApp-fixed2.zip
      - name: Add gradle properties
        run: printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > DjApp/gradle.properties
      - name: Patch Stems panel
        run: sed -i 's/^private fun StemsPanel/private fun ColumnScope.StemsPanel/' DjApp/app/src/main/java/com/example/djapp/Panels.kt
      - name: Patch tempo name clash
        run: sed -i 's/setTempoPct/applyTempo/g' DjApp/app/src/main/java/com/example/djapp/DeckState.kt DjApp/app/src/main/java/com/example/djapp/MainActivity.kt DjApp/app/src/main/java/com/example/djapp/Panels.kt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        working-directory: DjApp
        run: gradle assembleDebug --stacktrace > build.log 2>&1 || (echo BUILD_FAILED >> build.log; exit 1)
      - name: Show errors
        if: failure()
        working-directory: DjApp
        run: |
          {
            echo '## KOTLIN ERRORS'
            echo '```'
            grep -E "^e: " build.log | sed 's#file:///.*/djapp/##' | fold -s -w 55 | head -80 || true
            echo '```'
            echo '## OTHER'
            echo '```'
            grep -E "error:|Unresolved|CMake Error" build.log | fold -s -w 55 | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DjApp-debug-apk
          path: DjApp/app/build/outputs/apk/debug/app-debug.apk
