name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o DjApp-fixed4.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        working-directory: DjApp
        run: gradle assembleDebug --stacktrace > build.log 2>&1 || (echo BUILD_FAILED >> build.log; exit 1)
      - name: Show errors
        if: failure()
        working-directory: DjApp
        run: |
          {
            echo '## KOTLIN ERRORS'
            echo '```'
            grep -E "^e: " build.log | sed 's#file:///.*/djapp/##' | fold -s -w 55 | head -80 || true
            echo '```'
            echo '## OTHER'
            echo '```'
            grep -E "error:|Unresolved|CMake Error|What went wrong" -A3 build.log | fold -s -w 55 | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp DjApp/app/build/outputs/apk/debug/app-debug.apk MAXXIDODJ.apk
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest MAXXIDODJ.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "MAXXIDODJ latest build" --notes "Debug build of commit ${{ github.sha }}"
