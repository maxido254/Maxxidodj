name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DjApp.zip
      - run: |
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n" > DjApp/gradle.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --console=plain
        working-directory: DjApp
      - uses: actions/upload-artifact@v4
        with:
          name: DjApp-debug-apk
          path: DjApp/app/build/outputs/apk/debug/app-debug.apk
      - run: gh release create v${{ github.run_number }} DjApp/app/build/outputs/apk/debug/app-debug.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
