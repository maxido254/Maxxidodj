- name: Display build errors
        if: failure()
        working-directory: DjApp
        run: |
          {
            echo "## MAXXIDODJ Build Errors"
            echo '```text'
            if [ -f build.log ]; then
              tail -n 250 build.log
            else
              echo "build.log was not created."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
