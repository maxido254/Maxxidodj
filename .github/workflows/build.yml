name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pick and unpack the NEWEST project zip (and refuse an old one)
        run: |
          # 1) DjApp-crossdj-v3-newui-2.zip (then -1) wins when it is in the repo; 2) otherwise the zip committed most recently
          ZIP=$(ls DjApp-crossdj-v3-newui-2.zip DjApp-crossdj-v3-newui-1.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            ZIP=$(for f in DjApp*.zip; do [ -f "$f" ] && echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          fi
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            echo "ZIP_NAME=$(basename "$ZIP" .zip)" >> "$GITHUB_ENV"
            rm -rf DjApp
            unzip -q -o "$ZIP"
          elif [ -f DjApp/settings.gradle.kts ]; then
            echo "No zip in the repo; using the committed DjApp folder"
            echo "ZIP_NAME=DjApp-folder" >> "$GITHUB_ENV"
          else
            echo "::error::No DjApp*.zip found in the repo root"; ls -la; exit 1
          fi
          # Things that only exist in the newest version (EQ, stems prep, sampler, video): stop if missing.
          for f in app/src/main/cpp/stretch.h app/src/main/java/com/example/djapp/Prepared.kt \
                   app/src/main/java/com/example/djapp/Sampler.kt app/src/main/java/com/example/djapp/VideoMixer.kt; do
            test -f "DjApp/$f" || { echo "::error::DjApp/$f missing: OLD version in $ZIP"; exit 1; }
          done
          grep -q "setEq" DjApp/app/src/main/cpp/engine.cpp || { echo "::error::No EQ in $ZIP: OLD version"; exit 1; }
          echo "Building the newest version"
      - name: Cache AI model (SCNet-large, 45 MB, downloaded by Gradle at build time)
        uses: actions/cache@v4
        with:
          path: DjApp/app/src/main/assets/scnet-large.int8.onnx
          key: scnet-large-int8-onnx-v1
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        working-directory: DjApp
        run: gradle assembleDebug --stacktrace > build.log 2>&1 || (echo BUILD_FAILED >> build.log; exit 1)
      - name: Show errors
        if: failure()
        working-directory: DjApp
        run: |
          echo "===== ERRORS ====="
          grep -E "^e: |error:|What went wrong|Could not|checksum|SCNet" -A4 build.log | head -80 || true
          echo "===== LAST 40 LINES ====="
          tail -40 build.log
      - name: Report what takes space inside the APK
        run: |
          APK=DjApp/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "===== 25 BIGGEST FILES ====="
          unzip -lv "$APK" | awk 'NR>3 && NF>=8 {print $1, $3, $8}' | sort -rn | head -25 | awk '{printf "%7.1f MB raw, %7.1f MB in APK  %s\n", $1/1048576, $2/1048576, $3}'
          echo "===== PER FOLDER (MB) ====="
          unzip -lv "$APK" | awk 'NR>3 && NF>=8 {split($8,a,"/"); d[a[1]"/"a[2]]+=$1} END {for (k in d) printf "%7.1f  %s\n", d[k]/1048576, k}' | sort -rn | head -12
      - name: Name the APK after the zip it was built from
        run: |
          APK_NAME="MAXIDO-DJ_${ZIP_NAME}_run${GITHUB_RUN_NUMBER}"
          cp DjApp/app/build/outputs/apk/debug/app-debug.apk "DjApp/${APK_NAME}.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          {
            echo "## Built from: ${ZIP_NAME}.zip"
            echo "APK file: ${APK_NAME}.apk (run #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7})"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: DjApp/${{ env.APK_NAME }}.apk
